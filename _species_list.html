<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-iYQeCzEYFbKjA/T2uDLTpkwGzCiq6soy8tYaI1GyVh/UjpbCx/TYkiZhlZB6+fzT" crossorigin="anonymous">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css" rel="stylesheet">
  <!-- DataTables CSS -->
  <link rel="stylesheet" href="https://cdn.datatables.net/2.3.4/css/dataTables.dataTables.min.css">
  <!-- FixedHeader CSS -->
  <link rel="stylesheet" href="https://cdn.datatables.net/fixedheader/4.0.1/css/fixedHeader.dataTables.min.css">
  <!-- Responsive CSS -->
  <link rel="stylesheet" href="https://cdn.datatables.net/responsive/3.0.6/css/responsive.dataTables.min.css">

  <link rel="stylesheet" href="css/local-data-styles.css">
  <link rel="stylesheet" href="css/species-explorer-header.css">
  <link rel="stylesheet" href="css/species-explorer.css">
  <link href="VAL_Web_Utilities/css/infoPopup.css" rel="stylesheet">
  <link href="VAL_Web_Utilities/css/imageOverlay.css" rel="stylesheet"> 

  <!-- jQuery (required - DataTables works with jQuery 1.7+, but use latest) -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <!-- DataTables JS -->
  <script src="https://cdn.datatables.net/2.3.4/js/dataTables.min.js"></script>
  <!-- FixedHeader JS -->
  <script src="https://cdn.datatables.net/fixedheader/4.0.1/js/dataTables.fixedHeader.min.js"></script>
  <!-- Responsive JS -->
  <script src="https://cdn.datatables.net/responsive/3.0.6/js/dataTables.responsive.min.js"></script>

  <script type="module" src="./js/localSiteConfig.js">/*THIS SCRIPT MUST COME FIRST*/</script>
  <script type="module" src="js/gbif_auto_complete.js"></script>
  <script type="module" src="js/gbif_species_results.js"></script>
  
  <!-- Force all links within page to parent scope. -->
  <base target="_parent">
</head>

<body class="page-template-page-species-explorer">

  <section class="results" id="embed_species_list">

  	<!-- <div class="container species-display"> -->
  	<div class="species-display">

      <div class="row">

        <div class="col-12 col-lg-2 lg-offset-10 col-md-4 md-offset-8" id="species-download">
          <button class="btn btn-link" id="download-csv" type="submit" title="Download CSV">
            <i class="fa fa-download" aria-hidden="true"></i>
            CSV
          </button>
          <button class="btn btn-link" id="download-json" type="submit" title="Download JSON">
            <i class="fa fa-download" aria-hidden="true"></i>
            JSON
          </button>
          <a class="btn btn-link" id="flag-issue"
            href=""
            target="_blank"
            title="Flag an issue with VT Species Info"
            > 
            <i class="fa-solid fa-flag" aria-hidden="true"></i>
          </a>
        </div>

      </div> <!-- end main row -->

      <div class="centered-text">
          <label id="download-progress" class="download-progress">Downloading...</label>
      </div>

      <div id="download-overlay"></div>

      <div class="row" id="species-results">
        <div class="col-lg-12">
          <table id="species-table" class="species-checklist table table-striped table-responsive table-sm"></table>
        </div>
  		</div>

  	</div>

  </section>

</body>

</html>
